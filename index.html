    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      max-width: 550px;
      width: 100%;
    }
    h2 {
      color: #333;
      margin-bottom: 20px;
      text-align: center;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      color: #555;
      margin-bottom: 8px;
      font-weight: bold;
    }
    .required {
      color: #e74c3c;
    }
    input,
    textarea {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      background: #f9f9f9;
      transition: 0.2s;
    }
    input:focus,
    textarea:focus {
      outline: none;
      border-color: #667eea;
      background: white;
    }
    textarea {
      resize: vertical;
      min-height: 100px;
    }

    /* ===== LOCATION FIELD ===== */
    .location-wrapper {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .location-wrapper input {
      flex: 1;
    }
    .location-btn {
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 16px;
      cursor: pointer;
      font-size: 16px;
      white-space: nowrap;
      transition: 0.2s;
    }
    .location-btn:hover {
      background: #5a6fd6;
    }
    .location-btn i {
      margin-left: 6px;
    }

    /* ===== PHONE FIELD - RTL FIX ===== */
    .phone-input-wrapper {
      display: flex;
      padding: 0;
      background: #f9f9f9;
      border: 2px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
      transition: 0.2s;
      direction: ltr;
    }
    .phone-input-wrapper:focus-within {
      background: white;
      border-color: #667eea;
    }
    .phone-input-wrapper select {
      border: none;
      background: transparent;
      padding: 12px 10px;
      font-size: 16px;
      color: #333;
      cursor: pointer;
      border-right: 2px solid #ddd;
      min-width: 100px;
      outline: none;
      direction: ltr;
    }
    .phone-input-wrapper select option {
      background: white;
      color: #333;
    }
    .phone-input-wrapper input {
      border: none;
      background: transparent;
      flex: 1;
      padding: 12px 15px;
      font-size: 16px;
      outline: none;
      direction: ltr;
      text-align: left;
    }
    .phone-input-wrapper input:focus {
      background: transparent;
    }

    /* ===== BUTTON ===== */
    .btn-submit {
      width: 100%;
      padding: 15px;
      background: #25D366;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 10px;
    }
    .btn-submit:hover {
      background: #128C7E;
    }
    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* ===== STATUS ===== */
    .status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      text-align: center;
      font-weight: bold;
    }
    .success {
      display: block;
      background: #d4edda;
      color: #155724;
    }
    .error {
      display: block;
      background: #f8d7da;
      color: #721c24;
    }
    .loading {
      display: none;
      text-align: center;
      margin-top: 15px;
    }
    .loading.active {
      display: block;
    }
    .spinner {
      display: inline-block;
      width: 30px;
      height: 30px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .note {
      font-size: 12px;
      color: #888;
      text-align: center;
      margin-top: 15px;
    }
    .db-status {
      font-size: 12px;
      color: #1a5e8c;
      text-align: center;
      margin-top: 5px;
      background: #e3f2fd;
      padding: 4px 12px;
      border-radius: 20px;
      display: inline-block;
    }
  </style>
</head>

              const icon = L.icon({
                iconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',
                iconSize: [25, 41],
                iconAnchor: [12, 41],
                popupAnchor: [0, -41]
              });

              marker = L.marker([pos.lat, pos.lng], {
                draggable: true,
                icon: icon
              }).addTo(map);

              // Get address on drag
              marker.on('dragend', function(e) {
                const latlng = marker.getLatLng();
                getAddress(latlng.lat, latlng.lng);
              });

              // Click to move marker
              map.on('click', function(e) {
                marker.setLatLng(e.latlng);
                getAddress(e.latlng.lat, e.latlng.lng);
              });

              // Initial address
              await getAddress(pos.lat, pos.lng);
            }

            // Reverse geocoding using Nominatim (free, no API key)
            async function getAddress(lat, lng) {
              try {
                const response = await fetch(
                  \`https://nominatim.openstreetmap.org/reverse?lat=\${lat}&lon=\${lng}&format=json&accept-language=ar\`
                );
                const data = await response.json();
                if (data && data.display_name) {
                  selectedLocation = data.display_name;
                  document.getElementById('locationDisplay').textContent = selectedLocation;
                } else {
                  selectedLocation = \`\${lat.toFixed(6)}, \${lng.toFixed(6)}\`;
                  document.getElementById('locationDisplay').textContent = selectedLocation;
                }
              } catch (e) {
                selectedLocation = \`\${lat.toFixed(6)}, \${lng.toFixed(6)}\`;
                document.getElementById('locationDisplay').textContent = selectedLocation;
              }
            }

            // Confirm and close
            window.confirmLocation = function() {
              if (window.opener && selectedLocation) {
                window.opener.document.getElementById('location').value = selectedLocation;
                window.opener.document.getElementById('location').style.borderColor = '#28a745';
              }
              window.close();
            };

            // Load map when ready
            document.addEventListener('DOMContentLoaded', initMap);
          <\/script>
        </body>
        </html>
        `;

        mapPopup = window.open('', '_blank', `width=${width},height=${height},left=${left},top=${top},scrollbars=yes`);
        if (mapPopup) {
          mapPopup.document.write(mapHtml);
          mapPopup.document.close();
        } else {
          alert('⚠️ يرجى السماح للنوافذ المنبثقة لهذا الموقع');
        }
      };

      // ============================================================
      // 4. PHONE: build full number with country code
      // ============================================================
      function getFullPhone() {
        const countryCode = document.getElementById('countryCode').value;
        let phone = document.getElementById('phone').value.trim();
        phone = phone.replace(/^0+/, '').replace(/[^0-9]/g, '');
        if (!phone) return '';
        return countryCode + phone;
      }

      // ============================================================
      // 5. MAIN SUBMIT
      // ============================================================
      window.handleSubmit = async function() {
        const name = document.getElementById('name').value.trim();
        const address = document.getElementById('address').value.trim();
        const location = document.getElementById('location').value.trim();
        const message = document.getElementById('message').value.trim();
        const fullPhone = getFullPhone();

        const statusEl = document.getElementById('status');
        const submitBtn = document.getElementById('submitBtn');
        const loadingEl = document.getElementById('loading');
        const dbStatusEl = document.getElementById('dbStatus');

        statusEl.className = 'status';
        statusEl.style.display = 'none';

        if (!name) { showStatus('error', '❌ الرجاء إدخال الإسم'); return; }
        if (!address) { showStatus('error', '❌ الرجاء إدخال العنوان'); return; }
        if (!location) { showStatus('error', '❌ الرجاء اختيار الموقع من الخريطة'); return; }
        if (!fullPhone) { showStatus('error', '❌ الرجاء إدخال رقم التلفون'); return; }

        submitBtn.disabled = true;
        loadingEl.className = 'loading active';
        dbStatusEl.textContent = '⏳ جاري الحفظ في السحابة...';

        const formData = { name, address, location, phone: fullPhone, message };

        try {
          const { data, error } = await supabaseClient
            .from(TABLE_NAME)
            .insert([{
              name: formData.name,
              address: formData.address,
              location: formData.location,
              phone: formData.phone,
              message: formData.message || ''
            }]);

          if (error) {
            console.error('❌ Supabase error:', error);
            throw new Error(error.message);
          }

          console.log('✅ Saved to Supabase:', data);
          dbStatusEl.textContent = '✅ محفوظ في السحابة (Supabase)';

          setTimeout(() => {
            sendToWhatsApp(formData);
          }, 300);

          showStatus('success', '✅ تم الحفظ السحابي وإرسال واتساب!');

          setTimeout(() => {
            submitBtn.disabled = false;
            loadingEl.className = 'loading';
          }, 3000);

        } catch (err) {
          console.error('❌ Save failed:', err);
          dbStatusEl.textContent = '⚠️ فشل الحفظ السحابي';
          showStatus('error', '❌ خطأ في الحفظ: ' + err.message);
          submitBtn.disabled = false;
          loadingEl.className = 'loading';
        }
      };

      // ============================================================
      // 6. WHATSAPP
      // ============================================================
      function sendToWhatsApp(data) {
        let msg = '📋 *بيانات النموذج:*\n\n';
        msg += `👤 *الإسم:* ${data.name}\n`;
        msg += `🏠 *العنوان:* ${data.address}\n`;
        msg += `📍 *الموقع:* ${data.location}\n`;
        msg += `📞 *التلفون:* ${data.phone}\n`;
        if (data.message) msg += `\n💬 *رسالة إضافية:*\n${data.message}\n`;
        msg += `\n📅 *تاريخ الإرسال:* ${new Date().toLocaleString('ar-SA')}`;

        window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
      }

      // ============================================================
      // 7. UI HELPERS
      // ============================================================
      function showStatus(type, message) {
        const status = document.getElementById('status');
        status.className = `status ${type}`;
        status.style.display = 'block';
        status.textContent = message;
      }

      // ============================================================
      // 8. EVENTS
      // ============================================================
      document.addEventListener('keypress', function(e) {
        if (e.key === 'Enter' && e.target.tagName === 'INPUT') {
          e.preventDefault();
          const inputs = document.querySelectorAll('input, textarea');
          let index = Array.from(inputs).indexOf(e.target);
          if (index < inputs.length - 1) inputs[index + 1].focus();
          else handleSubmit();
        }
      });

      // ============================================================
      // 9. CHECK SUPABASE
      // ============================================================
      async function checkSupabase() {
        try {
          const { data, error } = await supabaseClient
            .from(TABLE_NAME)
            .select('count', { count: 'exact', head: true });
          if (error) throw error;
          console.log('✅ Supabase connected, table:', TABLE_NAME);
          document.getElementById('dbStatus').textContent = '☁️ قاعدة بيانات سحابية (Supabase) متصلة';
        } catch (e) {
          console.warn('⚠️ Failed to connect to Supabase:', e.message);
          document.getElementById('dbStatus').textContent = '⚠️ تأكد من إعداد Supabase بشكل صحيح';
          document.getElementById('dbStatus').style.background = '#ffecb3';
        }
      }

      setTimeout(checkSupabase, 500);

      console.log('✅ Form ready (Cloud save + WhatsApp)');
      console.log('📱 WhatsApp:', WHATSAPP_NUMBER);
      console.log('☁️ Supabase URL:', SUPABASE_URL);
    })();
  </script>
</body>
</html>
