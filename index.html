<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نموذج التواصل - WhatsApp</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }
  body {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .container {
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    max-width: 500px;
    width: 100%;
  }
  h2 {
    color: #333;
    margin-bottom: 20px;
    text-align: center;
    font-size: 24px;
  }
  .form-group {
    margin-bottom: 20px;
  }
  label {
    display: block;
    color: #555;
    margin-bottom: 8px;
    font-weight: bold;
    font-size: 14px;
  }
  .required {
    color: #e74c3c;
  }
  input, textarea, select {
    width: 100%;
    padding: 12px 15px;
    border: 2px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
    transition: border-color 0.3s;
    background: #f9f9f9;
  }
  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: #667eea;
    background: white;
  }
  textarea {
    resize: vertical;
    min-height: 100px;
  }
  button {
    width: 100%;
    padding: 15px;
    background: #25D366;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s;
    margin-top: 10px;
  }
  button:hover {
    background: #128C7E;
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(37, 211, 102, 0.3);
  }
  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }
  .status {
    margin-top: 15px;
    padding: 12px;
    border-radius: 8px;
    display: none;
    text-align: center;
    font-weight: bold;
  }
  .success {
    display: block;
    background: #d4edda;
    color: #155724;
    border: 1px solid #c3e6cb;
  }
  .error {
    display: block;
    background: #f8d7da;
    color: #721c24;
    border: 1px solid #f5c6cb;
  }
  .info {
    display: block;
    background: #d1ecf1;
    color: #0c5460;
    border: 1px solid #bee5eb;
  }
  .loading {
    display: none;
    text-align: center;
    margin-top: 15px;
  }
  .loading.active {
    display: block;
  }
  .spinner {
    display: inline-block;
    width: 30px;
    height: 30px;
    border: 4px solid #f3f3f3;
    border-top: 4px solid #667eea;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  .whatsapp-icon {
    display: inline-block;
    margin-right: 10px;
  }
  .note {
    font-size: 12px;
    color: #888;
    text-align: center;
    margin-top: 15px;
  }
</style>
</head>
<body>
<div class="container">
  <h2>📋 نموذج التواصل</h2>
  
  <form id="contactForm" onsubmit="return false;">
    <div class="form-group">
      <label>الإسم <span class="required">*</span></label>
      <input type="text" id="name" placeholder="أدخل الإسم الكامل" required>
    </div>
    
    <div class="form-group">
      <label>العنوان <span class="required">*</span></label>
      <input type="text" id="address" placeholder="أدخل العنوان" required>
    </div>
    
    <div class="form-group">
      <label>الموقع <span class="required">*</span></label>
      <input type="text" id="location" placeholder="أدخل الموقع" required>
    </div>
    
    <div class="form-group">
      <label>التلفون <span class="required">*</span></label>
      <input type="tel" id="phone" placeholder="أدخل رقم التلفون" required>
    </div>
    
    <div class="form-group">
      <label>رسالة إضافية</label>
      <textarea id="message" placeholder="أدخل أي تفاصيل إضافية..."></textarea>
    </div>
    
    <button type="button" onclick="submitToWhatsApp()" id="submitBtn">
      <span class="whatsapp-icon">📱</span> إرسال عبر واتساب
    </button>
  </form>
  
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p style="margin-top: 10px; color: #666;">جاري التحضير للإرسال...</p>
  </div>
  
  <div id="status" class="status"></div>
  <div class="note">سيتم فتح واتساب مع كافة البيانات المدخلة</div>
</div>

<script>
// WhatsApp number (without + or 00, just the number)
const WHATSAPP_NUMBER = '249117693634';

function submitToWhatsApp() {
  // Get form elements
  const name = document.getElementById('name').value.trim();
  const address = document.getElementById('address').value.trim();
  const location = document.getElementById('location').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const message = document.getElementById('message').value.trim();
  
  const status = document.getElementById('status');
  const submitBtn = document.getElementById('submitBtn');
  const loading = document.getElementById('loading');
  
  // Reset status
  status.className = 'status';
  status.style.display = 'none';
  
  // Validate required fields
  if (!name) {
    showStatus('error', '❌ الرجاء إدخال الإسم');
    document.getElementById('name').focus();
    return;
  }
  if (!address) {
    showStatus('error', '❌ الرجاء إدخال العنوان');
    document.getElementById('address').focus();
    return;
  }
  if (!location) {
    showStatus('error', '❌ الرجاء إدخال الموقع');
    document.getElementById('location').focus();
    return;
  }
  if (!phone) {
    showStatus('error', '❌ الرجاء إدخال رقم التلفون');
    document.getElementById('phone').focus();
    return;
  }
  
  // Show loading
  submitBtn.disabled = true;
  loading.className = 'loading active';
  
  // Build the WhatsApp message with all fields
  let whatsappMessage = '';
  whatsappMessage += '📋 *بيانات النموذج:*\n\n';
  whatsappMessage += `👤 *الإسم:* ${name}\n`;
  whatsappMessage += `🏠 *العنوان:* ${address}\n`;
  whatsappMessage += `📍 *الموقع:* ${location}\n`;
  whatsappMessage += `📞 *التلفون:* ${phone}\n`;
  if (message) {
    whatsappMessage += `\n💬 *رسالة إضافية:*\n${message}\n`;
  }
  whatsappMessage += `\n📅 *تاريخ الإرسال:* ${new Date().toLocaleString('ar-SA')}`;
  
  // Encode the message for URL
  const encodedMessage = encodeURIComponent(whatsappMessage);
  
  // Create WhatsApp URL
  const whatsappURL = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodedMessage}`;
  
  // Save to localStorage as backup (optional)
  try {
    const formData = {
      name, address, location, phone, message,
      timestamp: new Date().toISOString()
    };
    const history = JSON.parse(localStorage.getItem('form_history') || '[]');
    history.push(formData);
    localStorage.setItem('form_history', JSON.stringify(history));
  } catch (e) {
    // Silent fail for localStorage
  }
  
  // Show success message
  showStatus('success', '✅ تم تحضير البيانات! جاري فتح واتساب...');
  
  // Open WhatsApp after a short delay
  setTimeout(() => {
    // Open in new tab/window
    window.open(whatsappURL, '_blank');
    
    // Optionally, also try to open directly (for mobile)
    // window.location.href = whatsappURL;
    
    // Reset button after a moment
    setTimeout(() => {
      submitBtn.disabled = false;
      loading.className = 'loading';
      
      // Clear the form (optional)
      // document.getElementById('contactForm').reset();
    }, 2000);
  }, 1000);
}

// Helper function to show status messages
function showStatus(type, message) {
  const status = document.getElementById('status');
  status.className = `status ${type}`;
  status.style.display = 'block';
  status.textContent = message;
}

// Add Enter key support for all fields
document.addEventListener('keypress', function(e) {
  if (e.key === 'Enter') {
    const target = e.target;
    if (target.tagName === 'INPUT') {
      e.preventDefault();
      // Move to next input or submit if last
      const form = document.getElementById('contactForm');
      const inputs = form.querySelectorAll('input, textarea');
      let currentIndex = Array.from(inputs).indexOf(target);
      if (currentIndex < inputs.length - 1) {
        inputs[currentIndex + 1].focus();
      } else {
        submitToWhatsApp();
      }
    }
  }
});

// Auto-detect and format phone number
document.getElementById('phone').addEventListener('input', function() {
  // Remove any non-digit characters except +
  this.value = this.value.replace(/[^0-9+]/g, '');
});

console.log('✅ Form loaded successfully!');
console.log('📱 WhatsApp number:', WHATSAPP_NUMBER);
</script>
</body>
</html>
