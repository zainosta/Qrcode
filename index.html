<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نموذج التواصل</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}
  body{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
  .container{background:white;padding:30px;border-radius:15px;box-shadow:0 10px 30px rgba(0,0,0,0.3);max-width:500px;width:100%}
  h2{color:#333;margin-bottom:20px;text-align:center}
  .form-group{margin-bottom:20px}
  label{display:block;color:#555;margin-bottom:8px;font-weight:bold}
  .required{color:#e74c3c}
  input,textarea{width:100%;padding:12px 15px;border:2px solid #ddd;border-radius:8px;font-size:16px;background:#f9f9f9}
  input:focus,textarea:focus{outline:none;border-color:#667eea;background:white}
  textarea{resize:vertical;min-height:100px}
  button{width:100%;padding:15px;background:#25D366;color:white;border:none;border-radius:8px;font-size:18px;font-weight:bold;cursor:pointer;transition:all 0.3s;margin-top:10px}
  button:hover{background:#128C7E}
  button:disabled{opacity:0.6;cursor:not-allowed}
  .status{margin-top:15px;padding:12px;border-radius:8px;display:none;text-align:center;font-weight:bold}
  .success{display:block;background:#d4edda;color:#155724}
  .error{display:block;background:#f8d7da;color:#721c24}
  .loading{display:none;text-align:center;margin-top:15px}
  .loading.active{display:block}
  .spinner{display:inline-block;width:30px;height:30px;border:4px solid #f3f3f3;border-top:4px solid #667eea;border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
  .note{font-size:12px;color:#888;text-align:center;margin-top:15px}
</style>
</head>
<body>
<div class="container">
  <h2>📋 نموذج التواصل</h2>
  
  <form id="contactForm">
    <div class="form-group">
      <label>الإسم <span class="required">*</span></label>
      <input type="text" id="name" placeholder="أدخل الإسم الكامل" required>
    </div>
    <div class="form-group">
      <label>العنوان <span class="required">*</span></label>
      <input type="text" id="address" placeholder="أدخل العنوان" required>
    </div>
    <div class="form-group">
      <label>الموقع <span class="required">*</span></label>
      <input type="text" id="location" placeholder="أدخل الموقع" required>
    </div>
    <div class="form-group">
      <label>التلفون <span class="required">*</span></label>
      <input type="tel" id="phone" placeholder="أدخل رقم التلفون" required>
    </div>
    <div class="form-group">
      <label>رسالة إضافية</label>
      <textarea id="message" placeholder="أدخل أي تفاصيل إضافية..."></textarea>
    </div>
    
    <button type="button" onclick="submitForm()" id="submitBtn">
      📱 إرسال عبر واتساب
    </button>
  </form>
  
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p style="margin-top:10px;color:#666;">جاري الإرسال...</p>
  </div>
  
  <div id="status" class="status"></div>
  <div class="note">سيتم فتح واتساب مع البيانات</div>
</div>

<script>
const WHATSAPP_NUMBER = '249117693634';

// ⚠️ IMPORTANT: Replace these with your actual entry IDs from the form
// To find them: Right-click on each field in your form → Inspect → look for name="entry.XXXXX"
const FORM_ENTRY_IDS = {
  name: 'entry.726004286',    // Your actual ID
  address: 'entry.959984559', // Your actual ID
  location: 'entry.393130259',// Your actual ID
  phone: 'entry.1770489728'   // Your actual ID
};

// Your Google Form URL
const GOOGLE_FORM_URL = 'https://docs.google.com/forms/d/e/1FAIpQLScjKJKngOrJISga0KNfy3ikxSz62_Ux9j11kEPZSmA9wf8G9Q/viewform';

function submitForm() {
  const name = document.getElementById('name').value.trim();
  const address = document.getElementById('address').value.trim();
  const location = document.getElementById('location').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const message = document.getElementById('message').value.trim();
  
  const status = document.getElementById('status');
  const submitBtn = document.getElementById('submitBtn');
  const loading = document.getElementById('loading');
  
  status.className = 'status';
  status.style.display = 'none';
  
  if (!name) { showStatus('error', '❌ الرجاء إدخال الإسم'); return; }
  if (!address) { showStatus('error', '❌ الرجاء إدخال العنوان'); return; }
  if (!location) { showStatus('error', '❌ الرجاء إدخال الموقع'); return; }
  if (!phone) { showStatus('error', '❌ الرجاء إدخال رقم التلفون'); return; }
  
  submitBtn.disabled = true;
  loading.className = 'loading active';
  
  // Prepare data for Google Form
  const formData = {
    name: name,
    address: address,
    location: location,
    phone: phone
  };
  
  // --- 1. SEND TO GOOGLE FORM (using hidden iframe - works silently) ---
  submitToGoogleForm(formData);
  
  // --- 2. SEND TO WHATSAPP ---
  setTimeout(() => {
    sendToWhatsApp({ ...formData, message });
  }, 500);
  
  showStatus('success', '✅ تم الإرسال بنجاح! جاري فتح واتساب...');
  
  setTimeout(() => {
    submitBtn.disabled = false;
    loading.className = 'loading';
  }, 4000);
}

// This function submits data to Google Form using a hidden iframe
function submitToGoogleForm(data) {
  try {
    // Create a hidden form
    const hiddenForm = document.createElement('form');
    hiddenForm.method = 'POST';
    hiddenForm.action = GOOGLE_FORM_URL;
    hiddenForm.target = 'hiddenFrame';
    hiddenForm.style.display = 'none';
    
    // Add the entry fields with your data
    const fields = {
      [FORM_ENTRY_IDS.name]: data.name,
      [FORM_ENTRY_IDS.address]: data.address,
      [FORM_ENTRY_IDS.location]: data.location,
      [FORM_ENTRY_IDS.phone]: data.phone
    };
    
    Object.keys(fields).forEach(key => {
      const input = document.createElement('input');
      input.type = 'text';
      input.name = key;
      input.value = fields[key];
      hiddenForm.appendChild(input);
    });
    
    // Add to page and submit
    document.body.appendChild(hiddenForm);
    hiddenForm.submit();
    
    // Clean up
    setTimeout(() => {
      if (hiddenForm.parentNode) {
        hiddenForm.parentNode.removeChild(hiddenForm);
      }
    }, 2000);
    
    console.log('✅ Google Form submitted successfully!');
  } catch (error) {
    console.error('❌ Failed to submit to Google Form:', error);
  }
}

// Create hidden iframe for form submission
const iframe = document.createElement('iframe');
iframe.name = 'hiddenFrame';
iframe.style.cssText = 'position:absolute;width:0;height:0;border:0;opacity:0;display:none;';
document.body.appendChild(iframe);

function sendToWhatsApp(data) {
  let msg = '📋 *بيانات النموذج:*\n\n';
  msg += `👤 *الإسم:* ${data.name}\n`;
  msg += `🏠 *العنوان:* ${data.address}\n`;
  msg += `📍 *الموقع:* ${data.location}\n`;
  msg += `📞 *التلفون:* ${data.phone}\n`;
  if (data.message) msg += `\n💬 *رسالة إضافية:*\n${data.message}\n`;
  msg += `\n📅 *تاريخ الإرسال:* ${new Date().toLocaleString('ar-SA')}`;
  
  window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
}

function showStatus(type, message) {
  const status = document.getElementById('status');
  status.className = `status ${type}`;
  status.style.display = 'block';
  status.textContent = message;
}

document.addEventListener('keypress', function(e) {
  if (e.key === 'Enter' && e.target.tagName === 'INPUT') {
    e.preventDefault();
    const inputs = document.querySelectorAll('input, textarea');
    let index = Array.from(inputs).indexOf(e.target);
    if (index < inputs.length - 1) inputs[index + 1].focus();
    else submitForm();
  }
});

document.getElementById('phone').addEventListener('input', function() {
  this.value = this.value.replace(/[^0-9+]/g, '');
});

console.log('✅ Form loaded!');
console.log('📱 WhatsApp:', WHATSAPP_NUMBER);
</script>
</body>
</html>
