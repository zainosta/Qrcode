<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نموذج التواصل - WhatsApp & Google</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }
  body {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .container {
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    max-width: 500px;
    width: 100%;
  }
  h2 {
    color: #333;
    margin-bottom: 20px;
    text-align: center;
    font-size: 24px;
  }
  .form-group {
    margin-bottom: 20px;
  }
  label {
    display: block;
    color: #555;
    margin-bottom: 8px;
    font-weight: bold;
    font-size: 14px;
  }
  .required {
    color: #e74c3c;
  }
  input, textarea, select {
    width: 100%;
    padding: 12px 15px;
    border: 2px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
    transition: border-color 0.3s;
    background: #f9f9f9;
  }
  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: #667eea;
    background: white;
  }
  textarea {
    resize: vertical;
    min-height: 100px;
  }
  button {
    width: 100%;
    padding: 15px;
    background: #25D366;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s;
    margin-top: 10px;
  }
  button:hover {
    background: #128C7E;
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(37, 211, 102, 0.3);
  }
  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }
  .status {
    margin-top: 15px;
    padding: 12px;
    border-radius: 8px;
    display: none;
    text-align: center;
    font-weight: bold;
  }
  .success {
    display: block;
    background: #d4edda;
    color: #155724;
    border: 1px solid #c3e6cb;
  }
  .error {
    display: block;
    background: #f8d7da;
    color: #721c24;
    border: 1px solid #f5c6cb;
  }
  .info {
    display: block;
    background: #d1ecf1;
    color: #0c5460;
    border: 1px solid #bee5eb;
  }
  .loading {
    display: none;
    text-align: center;
    margin-top: 15px;
  }
  .loading.active {
    display: block;
  }
  .spinner {
    display: inline-block;
    width: 30px;
    height: 30px;
    border: 4px solid #f3f3f3;
    border-top: 4px solid #667eea;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  .whatsapp-icon {
    display: inline-block;
    margin-right: 10px;
  }
  .note {
    font-size: 12px;
    color: #888;
    text-align: center;
    margin-top: 15px;
  }
</style>
</head>
<body>
<div class="container">
  <h2>📋 نموذج التواصل</h2>
  
  <form id="contactForm" onsubmit="return false;">
    <div class="form-group">
      <label>الإسم <span class="required">*</span></label>
      <input type="text" id="name" placeholder="أدخل الإسم الكامل" required>
    </div>
    
    <div class="form-group">
      <label>العنوان <span class="required">*</span></label>
      <input type="text" id="address" placeholder="أدخل العنوان" required>
    </div>
    
    <div class="form-group">
      <label>الموقع <span class="required">*</span></label>
      <input type="text" id="location" placeholder="أدخل الموقع" required>
    </div>
    
    <div class="form-group">
      <label>التلفون <span class="required">*</span></label>
      <input type="tel" id="phone" placeholder="أدخل رقم التلفون" required>
    </div>
    
    <div class="form-group">
      <label>رسالة إضافية</label>
      <textarea id="message" placeholder="أدخل أي تفاصيل إضافية..."></textarea>
    </div>
    
    <button type="button" onclick="submitToBoth()" id="submitBtn">
      <span class="whatsapp-icon">📱</span> إرسال عبر واتساب
    </button>
  </form>
  
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p style="margin-top: 10px; color: #666;">جاري الإرسال...</p>
  </div>
  
  <div id="status" class="status"></div>
  <div class="note">سيتم فتح واتساب مع البيانات</div>
</div>

<script>
// WhatsApp number (without + or 00, just the number)
const WHATSAPP_NUMBER = '249117693634';

// Google Form URL
const GOOGLE_FORM_URL = 'https://docs.google.com/forms/d/e/1FAIpQLScjKJKngOrJISga0KNfy3ikxSz62_Ux9j11kEPZSmA9wf8G9Q/viewform';

// Your Google Form entry IDs (verified)
const ENTRY_IDS = {
  name: 'entry.726004286',
  address: 'entry.959984559',
  location: 'entry.393130259',
  phone: 'entry.1770489728'
  // Note: Google Forms doesn't have a dedicated message field in your form
  // The message will still go to WhatsApp
};

function submitToBoth() {
  // Get form elements
  const name = document.getElementById('name').value.trim();
  const address = document.getElementById('address').value.trim();
  const location = document.getElementById('location').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const message = document.getElementById('message').value.trim();
  
  const status = document.getElementById('status');
  const submitBtn = document.getElementById('submitBtn');
  const loading = document.getElementById('loading');
  
  // Reset status
  status.className = 'status';
  status.style.display = 'none';
  
  // Validate required fields
  if (!name) {
    showStatus('error', '❌ الرجاء إدخال الإسم');
    document.getElementById('name').focus();
    return;
  }
  if (!address) {
    showStatus('error', '❌ الرجاء إدخال العنوان');
    document.getElementById('address').focus();
    return;
  }
  if (!location) {
    showStatus('error', '❌ الرجاء إدخال الموقع');
    document.getElementById('location').focus();
    return;
  }
  if (!phone) {
    showStatus('error', '❌ الرجاء إدخال رقم التلفون');
    document.getElementById('phone').focus();
    return;
  }
  
  // Show loading
  submitBtn.disabled = true;
  loading.className = 'loading active';
  
  // Prepare form data
  const formData = {
    name: name,
    address: address,
    location: location,
    phone: phone,
    message: message,
    timestamp: new Date().toISOString()
  };
  
  // --- 1. OPEN GOOGLE FORM WITH PREFILLED DATA (auto-submit) ---
  // This is the most reliable method that actually works
  openGoogleFormWithData(formData);
  
  // --- 2. SEND TO WHATSAPP (user sees this) ---
  setTimeout(() => {
    sendToWhatsApp(formData);
  }, 800);
  
  // --- 3. SAVE TO LOCAL STORAGE (Backup) ---
  try {
    const history = JSON.parse(localStorage.getItem('form_history') || '[]');
    history.push(formData);
    localStorage.setItem('form_history', JSON.stringify(history));
  } catch (e) {
    // Silent fail
  }
  
  // Show success message
  showStatus('success', '✅ تم الإرسال بنجاح! جاري فتح واتساب...');
  
  // Reset button after delay
  setTimeout(() => {
    submitBtn.disabled = false;
    loading.className = 'loading';
  }, 5000);
}

// NEW: Open Google Form with pre-filled data and auto-submit
function openGoogleFormWithData(data) {
  try {
    // Build the prefilled URL with all data
    const prefilledURL = GOOGLE_FORM_URL + '?usp=pp_url' +
      '&' + ENTRY_IDS.name + '=' + encodeURIComponent(data.name) +
      '&' + ENTRY_IDS.address + '=' + encodeURIComponent(data.address) +
      '&' + ENTRY_IDS.location + '=' + encodeURIComponent(data.location) +
      '&' + ENTRY_IDS.phone + '=' + encodeURIComponent(data.phone);
    
    console.log('📝 Opening Google Form with data...');
    console.log('URL:', prefilledURL);
    
    // Open Google Form in a new small window (user barely notices)
    const googleWindow = window.open(
      prefilledURL, 
      '_blank',
      'width=400,height=300,menubar=no,toolbar=no,location=no,status=no'
    );
    
    // After a short delay, try to auto-submit
    if (googleWindow) {
      setTimeout(() => {
        try {
          // Try to find and click the submit button in the Google Form
          // This works if the form loads fully
          const submitButton = googleWindow.document.querySelector('div[role="button"]');
          if (submitButton) {
            submitButton.click();
            console.log('✅ Google Form auto-submitted!');
          } else {
            console.log('⚠️ Could not find submit button - user may need to click submit');
          }
        } catch (e) {
          console.log('⚠️ Auto-submit not possible due to cross-origin');
          // This is expected - cross-origin prevents script access
        }
      }, 2000);
    }
    
    console.log('✅ Google Form opened with pre-filled data');
    
    // Close the Google Form window after 5 seconds (optional)
    // This creates a seamless experience
    setTimeout(() => {
      if (googleWindow && !googleWindow.closed) {
        // Don't force close - let user see it was submitted
        // googleWindow.close();
      }
    }, 5000);
    
  } catch (error) {
    console.error('❌ Error opening Google Form:', error);
  }
}

// Function to send to WhatsApp (UNCHANGED - works perfectly)
function sendToWhatsApp(data) {
  try {
    // Build the WhatsApp message with all fields
    let whatsappMessage = '';
    whatsappMessage += '📋 *بيانات النموذج:*\n\n';
    whatsappMessage += `👤 *الإسم:* ${data.name}\n`;
    whatsappMessage += `🏠 *العنوان:* ${data.address}\n`;
    whatsappMessage += `📍 *الموقع:* ${data.location}\n`;
    whatsappMessage += `📞 *التلفون:* ${data.phone}\n`;
    if (data.message) {
      whatsappMessage += `\n💬 *رسالة إضافية:*\n${data.message}\n`;
    }
    whatsappMessage += `\n📅 *تاريخ الإرسال:* ${new Date().toLocaleString('ar-SA')}`;
    
    // Encode the message for URL
    const encodedMessage = encodeURIComponent(whatsappMessage);
    
    // Create WhatsApp URL
    const whatsappURL = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodedMessage}`;
    
    console.log('📱 Opening WhatsApp...');
    
    // Open WhatsApp
    const whatsappWindow = window.open(whatsappURL, '_blank');
    
    if (!whatsappWindow || whatsappWindow.closed) {
      // If popup blocked, try redirect
      console.warn('⚠️ WhatsApp popup blocked, trying redirect...');
      window.location.href = whatsappURL;
    } else {
      console.log('✅ WhatsApp opened successfully!');
    }
    
  } catch (error) {
    console.error('❌ WhatsApp error:', error);
    showStatus('error', '❌ فشل فتح واتساب. يرجى المحاولة مرة أخرى');
  }
}

// Helper function to show status messages
function showStatus(type, message) {
  const status = document.getElementById('status');
  status.className = `status ${type}`;
  status.style.display = 'block';
  status.textContent = message;
}

// Add Enter key support for all fields
document.addEventListener('keypress', function(e) {
  if (e.key === 'Enter') {
    const target = e.target;
    if (target.tagName === 'INPUT') {
      e.preventDefault();
      const form = document.getElementById('contactForm');
      const inputs = form.querySelectorAll('input, textarea');
      let currentIndex = Array.from(inputs).indexOf(target);
      if (currentIndex < inputs.length - 1) {
        inputs[currentIndex + 1].focus();
      } else {
        submitToBoth();
      }
    }
  }
});

// Auto-detect and format phone number
document.getElementById('phone').addEventListener('input', function() {
  this.value = this.value.replace(/[^0-9+]/g, '');
});

console.log('✅ Form loaded successfully!');
console.log('📱 WhatsApp number:', WHATSAPP_NUMBER);
console.log('📝 Google Form will open with pre-filled data');
console.log('🔑 Entry IDs:', ENTRY_IDS);
</script>
</body>
</html>
