<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Static QR Form</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}.container{background:white;padding:30px;border-radius:15px;box-shadow:0 10px 30px rgba(0,0,0,0.3);max-width:400px;width:100%}h2{color:#333;margin-bottom:20px;text-align:center}input,textarea{width:100%;padding:12px;margin:10px 0;border:1px solid #ddd;border-radius:8px;font-size:16px}button{width:100%;padding:14px;background:#667eea;color:white;border:none;border-radius:8px;font-size:18px;cursor:pointer;transition:0.3s}button:hover{background:#5a67d8}.status{margin-top:15px;padding:10px;border-radius:8px;display:none;text-align:center}.success{background:#d4edda;color:#155724;display:block}.error{background:#f8d7da;color:#721c24;display:block}
</style>
</head>
<body>
<div class="container">
  <h2>📋 QR Form</h2>
  <input type="text" id="name" placeholder="Your Name">
  <input type="email" id="email" placeholder="Email">
  <textarea id="message" rows="4" placeholder="Message"></textarea>
  <button onclick="submitData()">Send Data</button>
  <div id="status" class="status"></div>
</div>
<script>
function submitData(){
  var name=document.getElementById('name').value;
  var email=document.getElementById('email').value;
  var msg=document.getElementById('message').value;
  var status=document.getElementById('status');
  if(!name||!email||!msg){status.className='status error';status.textContent='⚠️ Please fill all fields';return;}
  var data={name:name,email:email,message:msg};
  // Send to your endpoint - replace with your URL
  fetch('https://your-api.com/submit',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(data)
  })
  .then(res=>res.json())
  .then(()=>{status.className='status success';status.textContent='✅ Data sent successfully!';})
  .catch(()=>{status.className='status error';status.textContent='❌ Failed to send. Please try again.';});
}
</script>
</body>
</html>
